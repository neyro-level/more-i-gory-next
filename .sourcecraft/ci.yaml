workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
    tasks:
      - name: exact-head-standard
        cubes:
          - name: contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
    tasks:
      - name: exact-head-risky
        cubes:
          - name: contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"

