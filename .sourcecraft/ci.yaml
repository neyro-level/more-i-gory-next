on: {}

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed PR head SHA"
    tasks:
      - name: exact-head-standard
        cubes:
          - name: docs-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                actual_sha="$(git rev-parse HEAD)"
                if [ "$actual_sha" != "${{ inputs.expected_commit_sha }}" ]; then
                  echo "Exact-head mismatch: actual=$actual_sha expected=${{ inputs.expected_commit_sha }}"
                  exit 1
                fi
                echo "Exact-head verified: $actual_sha"
              - git diff --check
              - bash scripts/ci/docs-presence.sh
              - |
                if [ -f package.json ]; then
                  corepack enable
                  pnpm --version
                  pnpm install --frozen-lockfile --reporter=append-only
                  pnpm audit --audit-level high
                  bash scripts/ci/bootstrap-verification-postgres.sh
                  export AMS_PROFILE=REALTY_BASE
                  export DATABASE_URI=postgresql://verify:verify@127.0.0.1:5432/moreigori_verify
                  export JOBS_AUTORUN=false
                  export NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:4311
                  export PAYLOAD_SECRET=ci-validation-only-payload-secret-not-for-production
                  export TZ=Europe/Moscow
                  pnpm payload migrate
                  pnpm media:seed
                  pnpm regions:seed
                  pnpm verify
                fi

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed risky PR head SHA"
    tasks:
      - name: exact-head-risky
        cubes:
          - name: bootstrap-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                actual_sha="$(git rev-parse HEAD)"
                if [ "$actual_sha" != "${{ inputs.expected_commit_sha }}" ]; then
                  echo "Exact-head mismatch: actual=$actual_sha expected=${{ inputs.expected_commit_sha }}"
                  exit 1
                fi
                echo "Exact-head verified: $actual_sha"
              - git diff --check
              - test -f .sourcecraft/ci.yaml
              - bash scripts/ci/docs-presence.sh
              - corepack enable
              - pnpm --version
              - pnpm install --frozen-lockfile --reporter=append-only
              - pnpm audit --audit-level high
              - |
                bash scripts/ci/bootstrap-verification-postgres.sh
                export AMS_PROFILE=REALTY_BASE
                export DATABASE_URI=postgresql://verify:verify@127.0.0.1:5432/moreigori_verify
                export JOBS_AUTORUN=false
                export NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:4311
                export PAYLOAD_SECRET=ci-validation-only-payload-secret-not-for-production
                export TZ=Europe/Moscow
                pnpm payload migrate
                pnpm media:seed
                pnpm regions:seed
                pnpm verify
              - pnpm verify:schema

  release-single-build:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Exact release candidate SHA"
      gate_run_slug:
        type: string
        required: true
        description: "Green exact-SHA Merge Gate run verified by the operator"
      previous_release_sha:
        type: string
        required: true
        description: "Known rollback release SHA"
      store_release_tag:
        type: string
        required: true
        description: "Draft SourceCraft Release used as the durable artifact store"
      target_server_url:
        type: string
        required: true
        description: "Exact public origin compiled into the immutable artifact"
    tasks:
      - name: exact-sha-release-unit
        cubes:
          - name: build-pack-rehearse
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - EXPECTED_COMMIT_SHA=${{ inputs.expected_commit_sha }} GATE_RUN_SLUG=${{ inputs.gate_run_slug }} PREVIOUS_RELEASE_SHA=${{ inputs.previous_release_sha }} STORE_RELEASE_TAG=${{ inputs.store_release_tag }} TARGET_SERVER_URL=${{ inputs.target_server_url }} bash scripts/ci/sourcecraft-release.sh
            artifacts:
              paths:
                - dist/sourcecraft-release/release.tar.gz
                - dist/sourcecraft-release/release.tar.gz.sha256
                - dist/sourcecraft-release/RELEASE_EVIDENCE.json
                - dist/sourcecraft-release/PACK_RESULT.json
