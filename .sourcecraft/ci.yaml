workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed PR head SHA"
    tasks:
      - name: exact-head-standard
        cubes:
          - name: docs-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"
              - git diff --check
              - test -f AGENTS.md
              - test -f docs/README.md
              - test -f docs/01_PRD.md
              - test -f docs/02_PRODUCT_STRUCTURE.md
              - test -f docs/03_ARCHITECTURE.md
              - test -f docs/04_BACKLOG.md
              - test -f docs/05_RELEASE_CHECKLIST.md
              - test -f docs/06_DESIGN_SYSTEM.md
              - test "$(grep -c '^### PAGE-' docs/02_PRODUCT_STRUCTURE.md)" -eq 23
              - test "$(grep -c '^| PAGE-[0-9][0-9][0-9]' docs/02_PRODUCT_STRUCTURE.md)" -eq 23
              - |
                if [ -f package.json ]; then
                  corepack enable
                  corepack prepare pnpm@11.5.1 --activate
                  pnpm install --frozen-lockfile
                  pnpm verify
                fi

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed risky PR head SHA"
    tasks:
      - name: exact-head-risky
        cubes:
          - name: bootstrap-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"
              - git diff --check
              - test -f .sourcecraft/ci.yaml
              - test -f AGENTS.md
              - test -f docs/README.md
              - test -f docs/01_PRD.md
              - test -f docs/02_PRODUCT_STRUCTURE.md
              - test -f docs/03_ARCHITECTURE.md
              - test -f docs/04_BACKLOG.md
              - test -f docs/05_RELEASE_CHECKLIST.md
              - test -f docs/06_DESIGN_SYSTEM.md
              - test "$(grep -c '^### PAGE-' docs/02_PRODUCT_STRUCTURE.md)" -eq 23
              - test "$(grep -c '^| PAGE-[0-9][0-9][0-9]' docs/02_PRODUCT_STRUCTURE.md)" -eq 23
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - pnpm install --frozen-lockfile
              - pnpm audit --audit-level high
              - pnpm verify
