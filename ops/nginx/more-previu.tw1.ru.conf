# Trusted real IP contract (TASK 13.3):
# This host is the TLS edge. The client address is $remote_addr.
# Do not honor inbound X-Forwarded-For from the public internet.
# If a Timeweb balancer is added later, pin it with set_real_ip_from <cidr>
# and only then switch real_ip_header.

limit_req_zone $binary_remote_addr zone=leads_per_client:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name more-previu.tw1.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name more-previu.tw1.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/more-previu.tw1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/more-previu.tw1.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://s3.twcstorage.ru; media-src 'self' blob: https://s3.twcstorage.ru; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Moreigory-Client-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 5s;
    }

    location = /api/public/leads {
        limit_req zone=leads_per_client burst=5 nodelay;
        limit_req_status 429;
        return 308 /api/public/leads/;
    }

    location = /api/public/leads/ {
        limit_req zone=leads_per_client burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
        # Nginx does not inherit server-level add_header values once a location defines one.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://s3.twcstorage.ru; media-src 'self' blob: https://s3.twcstorage.ru; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Keep the complete security baseline because this location defines add_header.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://s3.twcstorage.ru; media-src 'self' blob: https://s3.twcstorage.ru; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
