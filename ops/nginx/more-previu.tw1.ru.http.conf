# HTTP-only ACME bootstrap. Not the live vhost. Live traffic uses TLS
# in more-previu.tw1.ru.conf (port 80 only redirects).

server {
    listen 80;
    listen [::]:80;
    server_name more-previu.tw1.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
