# HISTORICAL ONLY. Not the current runtime config.
# Current: ../more-previu.tw1.ru.conf

server {
    listen 80;
    server_name moreigori.ru www.moreigori.ru;

    root /var/www/more-i-gory-next/out;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://yandex.ru https://yandex.com; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # This static example does not own Leads API routing. The current app-level
    # fail-closed switch is NEXT_PUBLIC_LEADS_ENABLED=false; production Node
    # reverse proxy for /api/public/leads is rendered in the release runbook.

    error_page 404 /404.html;

    location / {
        expires -1;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(?:css|js|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
